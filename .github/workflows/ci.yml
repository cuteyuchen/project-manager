name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Run TypeScript tests
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem tests -Filter *.test.ts | Sort-Object Name | ForEach-Object {
            Write-Host "==> $($_.Name)"
            npx --no-install tsx $_.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "FAILED: $($_.Name)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            wget
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Run TypeScript tests
        shell: bash
        run: |
          set -o pipefail
          failed=0
          while IFS= read -r test_file; do
            echo "==> $(basename "$test_file")"
            if ! npx --no-install tsx "$test_file"; then
              echo "FAILED: $(basename "$test_file")"
              failed=1
            fi
          done < <(find tests -maxdepth 1 -name '*.test.ts' -print | sort)
          test "$failed" -eq 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
